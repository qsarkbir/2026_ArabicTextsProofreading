name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
      - run: node --check proofreader/static/app.js
      - run: node --check proofreader/static/workflows.js
      - run: node --check proofreader/static/compare.js
      - run: node --check proofreader/static/local/openiti.js
      - run: node --check proofreader/static/local/work.js
  browser-and-tei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright lxml
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.browser_smoke
      - run: curl --fail --location --retry 2 -o /tmp/tei_all.rng https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/custom/schema/relaxng/tei_all.rng
      - run: python -m tests.validate_tei /tmp/tei_all.rng
